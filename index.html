<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登入</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="shell"><h1 data-app-title>永鮮x福爾摩沙 訂單系統</h1></div>
</header>

<main class="shell">
  <p id="loading" class="muted" style="text-align:center;margin-top:48px">載入中…</p>

  <section id="loginPanel" class="panel login" hidden>
    <h2>登入</h2>
    <div class="tabs" role="tablist" aria-label="登入身分">
      <button type="button" class="btn btn-sm tab" role="tab" data-mode="partner" aria-selected="true">客戶／廠商</button>
      <button type="button" class="btn btn-sm tab" role="tab" data-mode="staff" aria-selected="false">公司人員</button>
    </div>
    <p id="loginHint" class="muted"></p>
    <div id="loginError" class="banner banner-error" hidden></div>
    <form id="loginForm">
      <div class="field" id="userField">
        <label for="username">帳號</label>
        <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </div>
      <div class="field">
        <label for="password">密碼</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" class="btn btn-primary">登入</button>
    </form>
    <p class="muted" style="margin-top:16px">忘記密碼請聯絡我們重設。</p>
  </section>

  <section id="pwPanel" class="panel login" hidden>
    <h2>修改密碼</h2>
    <p id="pwHint" class="muted"></p>
    <div id="pwError" class="banner banner-error" hidden></div>
    <form id="pwForm">
      <input type="text" id="pwUser" autocomplete="username" hidden>
      <div class="field">
        <label for="oldPw">目前的密碼</label>
        <input id="oldPw" type="password" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="newPw">新密碼（至少 8 個字元）</label>
        <input id="newPw" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="field">
        <label for="newPw2">再輸入一次新密碼</label>
        <input id="newPw2" type="password" autocomplete="new-password" minlength="8" required>
      </div>
      <div class="actions">
        <button id="pwBtn" class="btn btn-primary">儲存新密碼</button>
        <a id="pwBack" class="btn btn-ghost" href="index.html" hidden>返回</a>
        <button type="button" id="pwLogout" class="btn btn-ghost">登出</button>
      </div>
    </form>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="common.js"></script>
<script>
const $ = id => document.getElementById(id);
App.header();

function show(id) {
  ['loading', 'loginPanel', 'pwPanel'].forEach(x => { $(x).hidden = x !== id; });
}

// 客戶／廠商：帳號＋密碼；公司人員（系統管理員、Boss、員工）：只輸入密碼
let mode = localStorage.getItem('loginMode') === 'staff' ? 'staff' : 'partner';

function setMode(m) {
  mode = m;
  try { localStorage.setItem('loginMode', m); } catch (e) { /* 無法記住也沒關係 */ }
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-selected', b.dataset.mode === m));
  const staff = m === 'staff';
  $('userField').hidden = staff;
  $('username').required = !staff;
  $('loginHint').textContent = staff ? '系統管理員、Boss、員工請直接輸入自己的密碼。' : '請輸入我們提供的帳號和密碼。';
  $('loginError').hidden = true;
  (staff || $('username').value ? $('password') : $('username')).focus();
}

document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));

function showLogin(msg) {
  show('loginPanel');
  setMode(mode);
  $('loginError').hidden = !msg;
  $('loginError').textContent = msg || '';
}

function showPassword(user) {
  show('pwPanel');
  $('pwUser').value = user.username;
  $('pwHint').textContent = user.mustChange
    ? `${user.name}，這是你第一次登入或密碼剛被重設，請設定自己的密碼。`
    : `${user.name}，請輸入目前的密碼與新密碼。`;
  $('pwBack').hidden = user.mustChange;
  $('pwBack').href = App.homeFor(user.role);
  $('oldPw').focus();
}

async function start() {
  if (location.hash === '#role') {
    history.replaceState(null, '', 'index.html');
    return showLogin('這個帳號不能使用這個頁面。如果剛改過角色，請確認 Apps Script 已用「新版本」重新部署。');
  }
  if (!App.session) return showLogin();
  try {
    const d = await App.api('me');
    App.setSession(null, d.user);
    if (d.user.mustChange || location.hash === '#password') showPassword(d.user);
    else location.replace(App.homeFor(d.user.role));
  } catch (e) {
    if (e.auth) { App.clearSession(); showLogin(); } else showLogin(e.message);
  }
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginError').hidden = true;
  try {
    const d = await App.busy($('loginBtn'), '登入中…', () => App.api('login', mode === 'staff'
      ? { staff: true, password: $('password').value }
      : { username: $('username').value.trim(), password: $('password').value }));
    App.setSession(d.session, d.user);
    if (d.user.mustChange) showPassword(d.user);
    else location.replace(App.homeFor(d.user.role));
  } catch (err) {
    $('loginError').textContent = err.message;
    $('loginError').hidden = false;
    $('password').select();
  }
});

$('pwForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('pwError').hidden = true;
  if ($('newPw').value !== $('newPw2').value) {
    $('pwError').textContent = '兩次輸入的新密碼不一樣';
    $('pwError').hidden = false;
    return;
  }
  try {
    const d = await App.busy($('pwBtn'), '儲存中…', () => App.api('changePassword', {
      oldPassword: $('oldPw').value, newPassword: $('newPw').value,
    }));
    App.setSession(null, d.user);
    App.toast('密碼已更新');
    setTimeout(() => location.replace(App.homeFor(d.user.role)), 700);
  } catch (err) {
    if (err.auth === 'login') { App.clearSession(); return showLogin(err.message); }
    $('pwError').textContent = err.message;
    $('pwError').hidden = false;
  }
});

$('pwLogout').addEventListener('click', App.logout);
window.addEventListener('hashchange', start);
start();
</script>
</body>
</html>
